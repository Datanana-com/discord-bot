# Runs the unit and feature tests (composer test), with code coverage.
#
# Only when something the tests depend on changed: PHP code, the tests and their fixtures,
# the dependencies or PHPUnit's configuration. Not on draft pull requests: they run once
# marked ready for review.
name: Tests

on:
  push:
    branches: [master]
    paths:
      - '**.php'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.php'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, sodium, mbstring, zip, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: pcov

      # tests/Feature/VoiceCallTest.php plays and decodes real audio, like the bot.
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # --fail-on-skipped: VoiceCallTest skips itself without ffmpeg or libopus, which must not go unnoticed here.
      - name: Run the tests
        run: composer test:coverage -- --fail-on-skipped
